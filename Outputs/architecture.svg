e="normal">- rule baseline + LogReg (interpretable reference)</text><text x="66" y="410.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- HGB, damped segment-weighted -- PRODUCTION model</text><text x="66" y="426.5" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- XGBoost -- comparison only</text><text x="66" y="443.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- calibrate (isotonic) BEFORE threshold search</text><text x="66" y="459.5" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">-   [ordering fix -- see README Sec. 2]</text><text x="66" y="476.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- macro-cost threshold selection, not blended</text><text x="66" y="492.5" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">-   (blended cost favors majority segment)</text><text x="66" y="509.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- single frozen TEST evaluation + MCC</text><text x="66" y="525.5" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- reason codes: permutation importance, direction-aware</text><text x="66" y="542.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- recall-by-segment diagnostics (COD vs Prepaid)</text><line x1="300.0" y1="568.5" x2="300.0" y2="588.5" stroke="#475569" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="50" y="588.5" width="500" height="46" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="300.0" y="607.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#065f46" font-family="monospace" font-style="normal">model.joblib  -  calibrator.joblib</text><text x="300.0" y="624.5" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#065f46" font-family="monospace" font-style="normal">summary.json  -  reason_code_reference.json</text><rect x="562" y="630.5" width="210" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" stroke-dasharray="4,3"/><text x="667.0" y="647.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0f172a" font-family="monospace" font-style="normal">evaluate.py</text><text x="667.0" y="662.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0f172a" font-family="monospace" font-style="normal">-&gt; evaluation_plots.png</text><text x="667.0" y="677.5" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#0f172a" font-family="monospace" font-style="normal">(PR / cost / calibration)</text><line x1="550" y1="647.5" x2="562" y2="647.5" stroke="#334155" stroke-width="2.2" marker-end="url(#arrowhead)" stroke-dasharray="4,3"/><line x1="300.0" y1="634.5" x2="300.0" y2="654.5" stroke="#475569" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="44" y="648.5" width="512" height="183.5" rx="14" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/><rect x="50" y="654.5" width="500" height="171.5" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="300.0" y="679.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a" font-family="monospace" font-style="normal">serve.py  (FastAPI)</text><text x="66" y="700.5" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- DEFENSE-ONLY: two response shapes, one endpoint</text><text x="66" y="717.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">-   (reviewer_view flag)</text><text x="66" y="733.5" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- reviewer_view=False (default): checkout-facing --</text><text x="66" y="750.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">-   coarse decision + reason codes. No score, no</text><text x="66" y="766.5" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">-   threshold. Prevents decision-boundary probing.</text><text x="66" y="783.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- reviewer_view=True: full transparency (score,</text><text x="66" y="799.5" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">-   calibrated_score, threshold) -- internal only.</text><text x="542" y="829.0" font-size="9.5" font-weight="normal" text-anchor="end" fill="#dc2626" font-family="sans-serif" font-style="italic">defense-only boundary</text><line x1="300.0" y1="834.0" x2="300.0" y2="852.0" stroke="#475569" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="50" y="852.0" width="500" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="300.0" y="875.0" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#4c1d95" font-family="monospace" font-style="normal">app.py  (Streamlit reviewer demo)</text><text x="66" y="896.0" font-size="11" font-weight="normal" text-anchor="start" fill="#5b21b6" font-family="monospace" font-style="normal">- shows BOTH response views side by side, live</text><text x="66" y="912.5" font-size="11" font-weight="normal" text-anchor="start" fill="#5b21b6" font-family="monospace" font-style="normal">- presets incl. bracketed-order example (pitch video)</text><rect x="786" y="122" width="404" height="50" rx="1