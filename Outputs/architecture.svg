" font-style="normal">- single frozen TEST evaluation</text><text x="802" y="353.5" font-size="10.5" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- NO reason codes (V1-V28 PCA-anonymized)</text><text x="802" y="370.0" font-size="10.5" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">- NO customer entity -- nothing to leak the</text><text x="802" y="386.5" font-size="10.5" font-weight="normal" text-anchor="start" fill="#334155" font-family="monospace" font-style="normal">-   primary's expanding-window bug against</text><line x1="988.0" y1="413.0" x2="988.0" y2="433.0" stroke="#475569" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="786" y="433.0" width="404" height="46" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="988.0" y="452.0" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#065f46" font-family="monospace" font-style="normal">model_fraud.joblib  -  summary_fraud.json</text><text x="988.0" y="469.0" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#065f46" font-family="monospace" font-style="normal">val / test probability arrays</text><line x1="988.0" y1="479.0" x2="988.0" y2="499.0" stroke="#475569" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="786" y="499.0" width="404" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="988.0" y="524.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a" font-family="monospace" font-style="normal">evaluate_fraud.py</text><text x="988.0" y="545.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#64748b" font-family="monospace" font-style="italic">-&gt; evaluation_plots_fraud.png</text><rect x="786" y="573.0" width="404" height="54" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" stroke-dasharray="4,3"/><text x="988.0" y="597.0" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#991b1b" font-family="monospace" font-style="normal">No serving layer for this artifact --</text><text x="988.0" y="612.0" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#991b1b" font-family="monospace" font-style="normal">comparison / methodology-breadth only</text><text x="620.0" y="952.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-style="normal">Legend</text><rect x="181.25" y="968.0" width="18" height="18" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="207.25" y="982.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="sans-serif" font-style="normal">code / script</text><rect x="317.75" y="968.0" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="343.75" y="982.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="sans-serif" font-style="normal">data file</text><rect x="428.25" y="968.0" width="18" height="18" rx="4" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="454.25" y="982.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="sans-serif" font-style="normal">saved model / metric artifact</text><rect x="668.75" y="968.0" width="18" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="694.75" y="982.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="sans-serif" font-style="normal">serving / demo layer</text><rect x="850.75" y="968.0" width="18" height="18" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="876.75" y="982.0" font-size="11" font-weight="normal" text-anchor="start" fill="#334155" font-family="sans-serif" font-style="normal">independent verification</text><text x="620.0" y="1008.0" font-size="11" font-weight="normal" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-style="italic">Full methodology, ci